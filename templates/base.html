<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Invoice Desk{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><header><div class="nav"><a class="brand" href="{{ url_for('index') }}">Invoice Desk</a><nav><a href="{{ url_for('index') }}">Dashboard</a><a href="{{ url_for('new_invoice') }}">New invoice</a><a href="{{ url_for('reports') }}">Reports</a></nav></div></header>
<main>{% with messages = get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}
{% block content %}{% endblock %}</main><footer>Invoice Desk · Local invoice management</footer></body></html>
